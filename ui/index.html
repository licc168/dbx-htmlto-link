      function previewCell(value) {
        if (value === null || value === undefined) return "";
        if (typeof value === "object") {
          try { return JSON.stringify(value); } catch { return String(value); }
        }
        return String(value);
      }

      function renderPreview(snapshot) {
        const host = $("preview");
        host.replaceChildren();
        if (!snapshot.columns.length) {
          const note = document.createElement("p");
          note.className = "muted";
          note.style.padding = "12px";
          note.textContent = window.dbxPlugin ? text.noRows : text.outside;
          host.appendChild(note);
          return;
        }
        const names = snapshot.columns.map((column, index) => {
          const raw = typeof column === "string" ? column : column && column.name;
          return typeof raw === "string" && raw.trim() ? raw.trim() : "column_" + (index + 1);
        });
        const table = document.createElement("table");
        const head = document.createElement("tr");
        for (const name of names) {
          const cell = document.createElement("th");
          cell.textContent = name;
          head.appendChild(cell);
        }
        const thead = document.createElement("thead");
        thead.appendChild(head);
        table.appendChild(thead);
        const body = document.createElement("tbody");
        const sample = snapshot.rows.slice(0, 8);
        for (const row of sample) {
          const tr = document.createElement("tr");
          const values = Array.isArray(row)
            ? names.map((_, index) => row[index])
            : row && typeof row === "object"
              ? names.map((name) => row[name])
              : names.map(() => row);
          for (const value of values) {
            const cell = document.createElement("td");
            cell.textContent = previewCell(value);
            tr.appendChild(cell);
          }
          body.appendChild(tr);
        }
        table.appendChild(body);
        host.appendChild(table);
      }

      function renderTablePreview() {
        const host = $("preview");
        host.replaceChildren();
        if (tableLoading) {
          const note = document.createElement("p");
          note.className = "muted";
          note.style.padding = "12px";
          note.textContent = text.loadingStructure;
          host.appendChild(note);
          return;
        }
        if (!tableColumns.length) {
          const note = document.createElement("p");
          note.className = "muted";
          note.style.padding = "12px";
          note.textContent = tableProblemText() || text.noFields;
          host.appendChild(note);
          return;
        }
        const tableComment = tableContext ? commentOf(tableContext.table) : "";
        if (tableComment) {
          const note = document.createElement("p");
          note.style.padding = "10px 12px 0";
          note.textContent = tableComment;
          host.appendChild(note);
        }
        const describe = window.HtmlToLinkTable && window.HtmlToLinkTable.describeColumn;
        const showComment = tableCommentState === "ready";
        const table = document.createElement("table");
        const head = document.createElement("tr");
        const labels = [text.field, text.type, text.nullable, text.defaultValue];
        if (showComment) labels.push(text.comment);
        for (const label of labels) {
          const cell = document.createElement("th");
          cell.textContent = label;
          head.appendChild(cell);
        }
        const thead = document.createElement("thead");
        thead.appendChild(head);
        table.appendChild(thead);
        const body = document.createElement("tbody");
        for (let index = 0; index < tableColumns.length && index < 12; index += 1) {
          const column = tableColumns[index];
          const name = column && column.name ? String(column.name) : "";
          const saved = tableColumnComments.find((item) => item.name === name)
            || tableColumnComments.find((item) => name && item.name.toLowerCase() === name.toLowerCase());
          const source = !saved
            ? column
            : column && typeof column === "object"
              ? Object.assign({}, column, { comment: saved.comment })
              : { name: column, comment: saved.comment };
          const field = describe
            ? describe(source, index)
            : {
              name,
              type: column && column.dataType ? String(column.dataType) : "",
              nullable: column ? column.nullable : undefined,
              defaultValue: column && column.default != null ? String(column.default) : "",
              comment: saved ? saved.comment : "",
            };
          const nullable = field.nullable === false ? text.nullableNo : field.nullable === true ? text.nullableYes : "";
          const values = [field.name, field.type, nullable, field.defaultValue];
          if (showComment) values.push(field.comment || "");
          const tr = document.createElement("tr");
          for (const value of values) {
            const cell = document.createElement("td");
            cell.textContent = value == null ? "" : String(value);
            tr.appendChild(cell);
          }
          body.appendChild(tr);
        }
        table.appendChild(body);
        host.appendChild(table);
        if (tableCommentState === "loading" || tableCommentState === "idle") host.appendChild(previewNote(text.loadingComments));
        else if (tableCommentState === "failed") host.appendChild(previewNote(text.commentsFailed + (tableCommentDetail ? ": " + tableCommentDetail : "")));
        else if (tableCommentState === "skipped") host.appendChild(previewNote(text.commentsSkipped));
        else if (tableCommentTruncated) host.appendChild(previewNote(text.catalogTruncated));
        appendIndexPreview(host);
        appendForeignKeyPreview(host);
      }

      function previewNote(message) {
        const note = document.createElement("p");
        note.className = "muted";
        note.style.padding = "12px";
        note.textContent = message;
        return note;
      }

      function appendIndexPreview(host) {
        if (tableIndexState === "loading" || tableIndexState === "idle") {
          host.appendChild(previewNote(text.loadingIndexes));
          return;
        }
        if (tableIndexState === "failed") {
          host.appendChild(previewNote(text.indexesFailed + (tableIndexDetail ? ": " + tableIndexDetail : "")));
          return;
        }
        if (tableIndexState === "skipped") {
          host.appendChild(previewNote(text.indexesSkipped));
          return;
        }
        const title = document.createElement("p");
        title.style.padding = "10px 12px 0";
        title.style.fontWeight = "600";
        title.textContent = text.indexHeading;
        host.appendChild(title);
        if (!tableIndexes.length) {
          host.appendChild(previewNote(text.noIndexes));
          return;
        }
        const kinds = {
          primary: text.indexPrimary,
          unique: text.indexUnique,
          fulltext: text.indexFulltext,
          spatial: text.indexSpatial,
          plain: text.indexPlain,
        };
        const labelOf = window.HtmlToLinkTable && window.HtmlToLinkTable.indexKindLabel;
        const table = document.createElement("table");
        const head = document.createElement("tr");
        for (const label of [text.indexName, text.indexKind, text.indexColumns]) {
          const cell = document.createElement("th");
          cell.textContent = label;
          head.appendChild(cell);
        }
        const thead = document.createElement("thead");
        thead.appendChild(head);
        table.appendChild(thead);
        const body = document.createElement("tbody");
        for (let index = 0; index < tableIndexes.length && index < 30; index += 1) {
          const item = tableIndexes[index];
          const tr = document.createElement("tr");
          const values = [
            item.name,
            labelOf ? labelOf(item, kinds) : item.name,
            Array.isArray(item.columns) ? item.columns.join(", ") : "",
          ];
          for (const value of values) {
            const cell = document.createElement("td");
            cell.textContent = value == null ? "" : String(value);
            tr.appendChild(cell);
          }
          body.appendChild(tr);
        }
        table.appendChild(body);
        host.appendChild(table);
        if (tableIndexTruncated) host.appendChild(previewNote(text.indexesTruncated));
      }

      function appendForeignKeyPreview(host) {
        if (tableForeignKeyState === "loading" || tableForeignKeyState === "idle") {
          host.appendChild(previewNote(text.loadingForeignKeys));
          return;
        }
        if (tableForeignKeyState === "failed") {
          host.appendChild(previewNote(text.foreignKeysFailed + (tableForeignKeyDetail ? ": " + tableForeignKeyDetail : "")));
          return;
        }
        if (tableForeignKeyState === "skipped") {
          host.appendChild(previewNote(text.foreignKeysSkipped));
          return;
        }
        const title = document.createElement("p");
        title.style.padding = "10px 12px 0";
        title.style.fontWeight = "600";
        title.textContent = text.foreignKeyHeading;
        host.appendChild(title);
        if (!tableForeignKeys.length) {
          host.appendChild(previewNote(text.noForeignKeys));
          return;
        }
        const referenceOf = window.HtmlToLinkTable && window.HtmlToLinkTable.foreignKeyReference;
        const table = document.createElement("table");
        const head = document.createElement("tr");
        for (const label of [text.fkName, text.fkColumns, text.fkReferences, text.fkDelete, text.fkUpdate]) {
          const cell = document.createElement("th");
          cell.textContent = label;
          head.appendChild(cell);
        }
        const thead = document.createElement("thead");
        thead.appendChild(head);
        table.appendChild(thead);
        const body = document.createElement("tbody");
        for (let index = 0; index < tableForeignKeys.length && index < 30; index += 1) {
          const item = tableForeignKeys[index];
          const tr = document.createElement("tr");
          const values = [
            item.name,
            Array.isArray(item.columns) ? item.columns.join(", ") : "",
            referenceOf ? referenceOf(item) : "",
            item.deleteRule || "",
            item.updateRule || "",
          ];
          for (const value of values) {
            const cell = document.createElement("td");
            cell.textContent = value == null ? "" : String(value);
            tr.appendChild(cell);
          }
          body.appendChild(tr);
        }
        table.appendChild(body);
        host.appendChild(table);
        if (tableForeignKeyTruncated) host.appendChild(previewNote(text.catalogTruncated));
      }

      function render() {
        const tableMode = mode === "table" && tableContext;
        $("heading").textContent = tableMode ? text.structureHeading : text.heading;
        $("lead").textContent = tableMode ? text.structureLead : text.lead;
        $("sqlOption").hidden = Boolean(tableMode);
        if (tableMode) {
          const bits = [];
          if (tableContext.database) bits.push(tableContext.database);
          if (tableContext.schema) bits.push(tableContext.schema);
          bits.push(tableContext.table);
          bits.push(tableColumns.length + " " + text.columns);
          if (tableLoading) bits.push(text.loadingStructure);
          else if (tableIndexState === "ready") bits.push(tableIndexes.length + " " + text.indexes);
          else if (catalogPending(tableIndexState)) bits.push(text.readingIndexes);
          if (!tableLoading && tableForeignKeyState === "ready") bits.push(tableForeignKeys.length + " " + text.foreignKeys);
          else if (!tableLoading && catalogPending(tableForeignKeyState)) bits.push(text.readingForeignKeys);
          bits.push(text.selectedTables + " " + chosenTableNames().length + " " + text.tablesUnit);
          $("meta").textContent = bits.join(" · ");
          renderTablePreview();
          renderTablePicker();
          const extrasPending = catalogPending(tableIndexState) || catalogPending(tableForeignKeyState) || catalogPending(tableCommentState) || catalogPending(tableListState);
          const ready = !publishing && !tableLoading && tableColumns.length > 0 && !extrasPending;
          $("create").disabled = !ready;
          $("update").disabled = !ready || !settings.last;
          $("more").hidden = true;
          const problem = tableProblemText();
          if (problem) showError(problem);
        } else {
          const snapshot = active();
          const bits = [snapshot.columns.length + " " + text.columns, snapshot.rows.length + " " + text.rows];
          if (snapshot.database) bits.push(snapshot.database);
          if (snapshot.schema) bits.push(snapshot.schema);
          if (pinned) bits.push(text.pinned);
          else if (snapshot.truncated) bits.push(text.truncated);
          $("meta").textContent = bits.join(" · ");
          renderPreview(snapshot);
          $("create").disabled = publishing || snapshot.columns.length === 0;
          $("update").disabled = publishing || snapshot.columns.length === 0 || !settings.last;
          const canReread = Boolean(grid.sql && grid.connectionId && (grid.truncated || pinned));
          const canQuery = Boolean(window.dbxPlugin && window.dbxPlugin.capabilities && window.dbxPlugin.capabilities.dataApi && typeof window.dbxPlugin.queryData === "function");
          $("more").hidden = !canReread;
          $("moreLead").textContent = canQuery ? text.moreLead : text.noDataApi;
          $("loadMore").hidden = !canQuery;
          $("maxRowsLabel").hidden = !canQuery;
          $("useGrid").hidden = !pinned;
          $("tablePicker").hidden = true;
        }
        if (!window.dbxPlugin || !window.dbxPlugin.capabilities || !window.dbxPlugin.capabilities.storage) {
          $("tokenHelp").textContent = text.tokenHelp + " " + text.storageOff;
        }
      }

      function showError(message) {
        $("error").textContent = message || "";
      }

      function noteFor(snapshot) {
        if (pinned && snapshot.truncated) {
          return text === copy.zh
            ? "重新读取时到达上限，页面里是前 " + snapshot.rows.length + " 行。"
            : "The re-read stopped at the cap. This page has the first " + snapshot.rows.length + " rows.";
        }
        if (!pinned && snapshot.truncated) {
          return text === copy.zh
            ? "网格只带了前 " + snapshot.rows.length + " 行，后面的行没有放进这个页面。"
            : "The grid only included the first " + snapshot.rows.length + " rows. Later rows are not on this page.";
        }
        return "";
      }

      async function persist() {
        const host = window.dbxPlugin;
        settings.includeSql = $("includeSql").checked;
        settings.apiToken = $("token").value;
        settings.templateId = $("template").value || "plain";
        settings.themeClass = selectedTheme();
        if (!host || !host.capabilities || !host.capabilities.storage || !host.storage) return;
        await host.storage.set(STORAGE_KEY, {
          apiToken: settings.apiToken,
          includeSql: settings.includeSql,
          templateId: settings.templateId,
          themeClass: settings.themeClass,
          last: settings.last,
        });
      }

      async function publish(action) {
        if (publishing) return;
        const snapshot = active();
        showError("");
        let built;
        try {
          if (mode === "table") {
            if (!tableContext || tableColumns.length === 0) return;
            const names = chosenTableNames();
            const tables = [];
            for (let index = 0; index < names.length; index += 1) {
              publishStatus = text.readingTable + " " + (index + 1) + "/" + names.length + " " + names[index];
              $("create").disabled = true;
              $("create").textContent = publishStatus;
              tables.push(await ensureTableStructure(names[index]));
            }
            publishStatus = "";
            const countLabel = names.length + " " + text.tablesUnit;
            built = window.HtmlToLinkTable.buildTablesMarkdown({
              title: $("pageTitle").value || (names.length === 1 ? names[0] : (tableContext.database || names[0])),
              summary: [tableContext.database, tableContext.schema, countLabel].filter(Boolean).join(" · "),
              note: structureNote(),
              dbType: knownDbType,
              ddlHeading: text.ddlHeading,
              indexHeading: text.indexHeading,
              noIndexes: text.noIndexes,
              foreignKeyHeading: text.foreignKeyHeading,
              noForeignKeys: text.noForeignKeys,
              emptyColumns: text.emptyColumns,
              indexHeaders: {
                name: text.indexName,
                kind: text.indexKind,
                columns: text.indexColumns,
              },
              indexKinds: {
                primary: text.indexPrimary,
                unique: text.indexUnique,
                fulltext: text.indexFulltext,
                spatial: text.indexSpatial,
                plain: text.indexPlain,
              },
              foreignKeyHeaders: {
                name: text.fkName,
                columns: text.fkColumns,
                references: text.fkReferences,
                deleteRule: text.fkDelete,
                updateRule: text.fkUpdate,
              },
              headers: {
                name: text.field,
                type: text.type,
                nullable: text.nullable,
                defaultValue: text.defaultValue,
                comment: text.comment,
              },
              yes: text.nullableYes,
              no: text.nullableNo,
              columnFallback: (index) => (text === copy.zh ? "列" : "column_") + (index + 1),
              tables,
            });
          } else {
            built = window.HtmlToLinkTable.buildShareMarkdown({
              title: $("pageTitle").value || (text === copy.zh ? "查询结果" : "Query result"),
              columns: snapshot.columns,
              rows: snapshot.rows,
              summary: [snapshot.database, snapshot.schema, snapshot.rows.length + " " + text.rows].filter(Boolean).join(" · "),
              note: noteFor(snapshot),
              sql: snapshot.sql,
              includeSql: $("includeSql").checked,
              columnFallback: (index) => (text === copy.zh ? "列" : "column_") + (index + 1),
            });
          }
        } catch (error) {
          publishStatus = "";
          render();
          if (error && error.code === "TOO_LARGE") showError(text.tooLarge);
          else if (error && error.code === "TOO_MANY") showError(text.tooManyTables);
          else if (mode === "table") showError(text.noFields);
          else showError(text.noColumns);
          return;
        }
        const body = {
          content: built.markdown,
          title: built.title,
          templateId: $("template").value || "plain",
          channel: "dbx",
        };
        const themeClass = selectedTheme();
        if (themeClass) body.themeClass = themeClass;
        const password = $("password").value;
        if (action === "update") {
          if (!settings.last) {
            render();
            return;
          }
          body.updateToken = settings.last.updateToken;
          if ($("changePassword").checked) body.password = password;
        } else if (password) {
          body.password = password;
        }
        const headers = { "Content-Type": "application/json", Accept: "application/json" };
        const token = $("token").value.trim();
        if (token) headers.Authorization = "Bearer " + token;
        const path = action === "update"
          ? "/api/shares/" + encodeURIComponent(settings.last.slug)
          : "/api/shares";
        publishing = true;
        render();
        try {
          const response = await fetch(API_ORIGIN + path, {
            method: action === "update" ? "PUT" : "POST",
            headers,
            body: JSON.stringify(body),
          });
          let payload = {};
          try { payload = await response.json(); } catch { payload = {}; }
          if (response.status === 401) throw new Error(text.badToken);
          if (response.status === 429) throw new Error(text.rate);
          if (!response.ok || payload.success === false || payload.ok === false) {
            throw new Error(payload.error || payload.message || ("HTTP " + response.status));
          }
          const url = payload.url || (payload.slug ? API_ORIGIN + "/" + payload.slug : "");
          if (!url) throw new Error("HTTP " + response.status);
          shareUrl = url;
          settings.last = {
            slug: payload.slug || (settings.last && settings.last.slug) || "",
            updateToken: payload.updateToken || (settings.last && settings.last.updateToken) || "",
            url,
            title: built.title,
          };
          $("password").value = "";
          $("changePassword").checked = false;
          await persist();
          $("success").hidden = false;
          $("successText").textContent = action === "update" ? text.updated : text.created;
          $("shareUrl").textContent = url;
          const when = payload.expiresAt ? new Date(payload.expiresAt) : null;
          const whenText = when && !Number.isNaN(when.getTime())
            ? text.expires + when.toLocaleString(text === copy.zh ? "zh-CN" : "en")
            : "";
          $("expiry").textContent = [payload.temporary ? text.guest : text.account, whenText].filter(Boolean).join(" ");
        } catch (error) {
          const message = error instanceof TypeError ? text.cors : (error && error.message) || String(error);
          showError(message);
        } finally {
          publishing = false;
          render();
        }
      }

      async function loadMore() {
        const host = window.dbxPlugin;
        showError("");
        if (!grid.sql || !grid.connectionId) {
          showError(text.noSql);
          return;
        }
        if (!host || !host.capabilities || !host.capabilities.dataApi || typeof host.queryData !== "function") {
          showError(text.noDataApi);
          return;
        }
        const maxRows = Math.min(5000, Math.max(1, Math.round(Number($("maxRows").value) || 2000)));
        $("maxRows").value = String(maxRows);
        $("loadMore").disabled = true;
        try {
          const result = await host.queryData({
            connectionId: grid.connectionId,
            database: grid.database || undefined,
            schema: grid.schema || undefined,
            sql: grid.sql,
            maxRows,
          });
          pinned = {
            columns: result && Array.isArray(result.columns) ? result.columns : grid.columns,
            rows: result && Array.isArray(result.rows) ? result.rows : [],
            truncated: Boolean(result && result.truncated),
            sql: grid.sql,
            connectionId: grid.connectionId,
            database: grid.database,
            schema: grid.schema,
          };
          render();
        } catch (error) {
          showError(text.queryFailed + ": " + ((error && error.message) || String(error)));
        } finally {
          $("loadMore").disabled = false;
        }
      }

      async function copyLink() {
        if (!shareUrl) return;
        try {
          if (window.dbxPlugin && typeof window.dbxPlugin.copy === "function") {
            await window.dbxPlugin.copy(shareUrl);
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(shareUrl);
          } else {
            throw new Error("clipboard");
          }
          $("copy").textContent = text.copied;
        } catch {
          showError(text.copyFailed);
        }
      }

      function fillTitleFromGrid() {
        const input = $("pageTitle");
        const next = defaultTitle(grid);
        if (!input.value || input.value === autoTitle) {
          input.value = next;
          autoTitle = next;
        }
      }

      async function loadTable(target) {
        const request = ++tableRequest;
        const host = window.dbxPlugin;
        tableLoading = true;
        tableProblem = null;
        tableColumns = [];
        clearIndexes();
        clearCatalog();
        selectedTables.add(target.table);
        render();
        if (!host || !host.capabilities || !host.capabilities.schemaMetadataApi || typeof host.getTableMetadata !== "function") {
          if (request !== tableRequest) return;
          tableLoading = false;
          tableProblem = { code: "noSchemaApi" };
          render();
          return;
        }
        try {
          const result = await host.getTableMetadata({
            connectionId: target.connectionId,
            database: target.database || undefined,
            schema: target.schema || undefined,
            table: target.table,
          });
          if (request !== tableRequest) return;
          const columns = result && Array.isArray(result.columns) ? result.columns : [];
          tableColumns = columns;
          tableLoading = false;
          tableProblem = columns.length ? null : { code: "noFields" };
          if (!columns.length) {
            tableIndexState = "skipped";
            tableCommentState = "skipped";
            tableForeignKeyState = "skipped";
            tableListState = "skipped";
            render();
            return;
          }
          render();
          await Promise.all([
            loadIndexes(target, request),
            loadColumnComments(target, request),
            loadForeignKeys(target, request),
            loadTableList(target, request),
          ]);
        } catch (error) {
          if (request !== tableRequest) return;
          tableLoading = false;
          tableColumns = [];
          clearIndexes();
          clearCatalog();
          tableIndexState = "skipped";
          tableCommentState = "skipped";
          tableForeignKeyState = "skipped";
          tableListState = "skipped";
          tableProblem = { code: "schemaFailed", detail: (error && error.message) || "" };
          render();
        }
      }

      async function loadCatalogPart(target, request, part) {
        const host = window.dbxPlugin;
        const query = window.HtmlToLinkTable && window.HtmlToLinkTable[part.query];
        const parse = window.HtmlToLinkTable && window.HtmlToLinkTable[part.parse];
        const canQuery = Boolean(host && host.capabilities && host.capabilities.dataApi && typeof host.queryData === "function");
        if (!canQuery || typeof query !== "function" || typeof parse !== "function") {
          if (request !== tableRequest) return;
          part.finish("skipped", [], "", false);
          render();
          return;
        }
        part.finish("loading", [], "", false);
        render();
        try {
          const dbType = await detectDbType(target);
          if (request !== tableRequest) return;
          const sql = query({
            dbType,
            database: target.database,
            schema: target.schema,
            table: target.table,
          });
          if (!sql) {
            part.finish("skipped", [], "", false);
            render();
            return;
          }
          const result = await host.queryData({
            connectionId: target.connectionId,
            database: target.database || undefined,
            schema: target.schema || undefined,
            sql,
            maxRows: 500,
          });
          if (request !== tableRequest) return;
          part.finish(
            "ready",
            parse({ columns: result && result.columns, rows: result && result.rows }),
            "",
            Boolean(result && result.truncated),
          );
          render();
        } catch (error) {
          if (request !== tableRequest) return;
          part.finish("failed", [], (error && error.message) || "", false);
          render();
        }
      }

      function loadIndexes(target, request) {
        return loadCatalogPart(target, request, {
          query: "indexCatalogQuery",
          parse: "parseIndexRows",
          finish(state, rows, detail, truncated) {
            tableIndexState = state;
            tableIndexes = rows;
            tableIndexDetail = detail;
            tableIndexTruncated = truncated;
          },
        });
      }

      function loadColumnComments(target, request) {
        return loadCatalogPart(target, request, {
          query: "columnCommentQuery",
          parse: "parseColumnComments",
          finish(state, rows, detail, truncated) {
            tableCommentState = state;
            tableColumnComments = rows;
            tableCommentDetail = detail;
            tableCommentTruncated = truncated;
          },
        });
      }

      function loadForeignKeys(target, request) {
        return loadCatalogPart(target, request, {
          query: "foreignKeyQuery",
          parse: "parseForeignKeys",
          finish(state, rows, detail, truncated) {
            tableForeignKeyState = state;
            tableForeignKeys = rows;
            tableForeignKeyDetail = detail;
            tableForeignKeyTruncated = truncated;
          },
        });
      }

      async function loadTableList(target, request) {
        const host = window.dbxPlugin;
        const listQuery = window.HtmlToLinkTable && window.HtmlToLinkTable.tableListQuery;
        const parseList = window.HtmlToLinkTable && window.HtmlToLinkTable.parseTableList;
        const canQuery = Boolean(host && host.capabilities && host.capabilities.dataApi && typeof host.queryData === "function");
        if (!canQuery || typeof listQuery !== "function" || typeof parseList !== "function") {
          if (request !== tableRequest) return;
          tableListState = "skipped";
          catalogTables = [{ name: target.table, comment: "" }];
          selectedTables.add(target.table);
          render();
          return;
        }
        tableListState = "loading";
        render();
        try {
          const dbType = await detectDbType(target);
          if (request !== tableRequest) return;
          const sql = listQuery({ dbType, database: target.database, schema: target.schema });
          if (!sql) {
            tableListState = "skipped";
            catalogTables = [{ name: target.table, comment: "" }];
            selectedTables.add(target.table);
            render();
            return;
          }
          const result = await host.queryData({
            connectionId: target.connectionId,
            database: target.database || undefined,
            schema: target.schema || undefined,
            sql,
            maxRows: 500,
          });
          if (request !== tableRequest) return;
          const tables = parseList({ columns: result && result.columns, rows: result && result.rows });
          if (!tables.some((item) => item.name === target.table)) tables.unshift({ name: target.table, comment: "" });
          catalogTables = tables;
          selectedTables.add(target.table);
          tableListState = "ready";
          tableListDetail = result && result.truncated ? text.tooManyTables : "";
          render();
        } catch (error) {
          if (request !== tableRequest) return;
          tableListState = "failed";
          tableListDetail = (error && error.message) || "";
          catalogTables = [{ name: target.table, comment: "" }];
          selectedTables.add(target.table);
          render();
        }
      }

      function applyHostContext(context, options) {
        const keepTitle = Boolean(options && options.keepTitle);
        const target = readTableTarget(context);
        if (target) {
          const changed = !sameTable(tableContext, target);
          mode = "table";
          pinned = null;
          grid = emptySnapshot();
          tableContext = target;
          if (changed) {
            tableColumns = [];
            clearIndexes();
            clearCatalog();
            tableProblem = null;
            showError("");
            fillTitleFromTable(target);
            loadTable(target);
          }
          render();
          return;
        }
        const leftTable = mode === "table";
        mode = "query";
        tableContext = null;
        tableColumns = [];
        clearIndexes();
        clearCatalog();
        tableLoading = false;
        tableProblem = null;
        tableRequest += 1;
        if (leftTable) showError("");
        grid = readSnapshot(context || {});
        if (!keepTitle) fillTitleFromGrid();
        render();
      }

      function setFetchButton() {
        const button = $("fetchToken");
        button.textContent = tokenFetchState === "waiting"
          ? text.waitingToken
          : tokenFetchState === "filled"
            ? text.tokenFilled
            : text.fetchToken;
        button.disabled = tokenFetchState === "waiting";
      }

      function delay(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function safeTokenUrl(value) {
        try {
          const url = new URL(value);
          if (url.origin !== API_ORIGIN || url.pathname !== "/dbx/connect") return "";
          return url.toString();
        } catch {
          return "";
        }
      }

      async function fetchTokenFromAccount() {
        if (tokenFetchState === "waiting") return;
        const request = ++tokenPoll;
        tokenFetchState = "waiting";
        setFetchButton();
        showError("");
        $("tokenWait").hidden = true;
        try {
          const response = await fetch(API_ORIGIN + "/api/dbx/token-grant", {
            method: "POST",
            headers: { Accept: "application/json" },
          });
          let payload = {};
          try { payload = await response.json(); } catch { payload = {}; }
          if (response.status === 429) throw new Error(text.rate);
          const openUrl = safeTokenUrl(payload.openUrl);
          const pollSecret = typeof payload.pollSecret === "string" ? payload.pollSecret : "";
          if (!response.ok || payload.success === false || !openUrl || !pollSecret) {
            throw new Error(payload.message || text.tokenFailed);
          }
          let opened = null;
          try { opened = window.open(openUrl, "_blank", "noopener"); } catch { opened = null; }
          if (window.dbxPlugin && typeof window.dbxPlugin.copy === "function") {
            try { await window.dbxPlugin.copy(openUrl); } catch { /* the link stays on screen */ }
          }
          $("tokenWait").hidden = false;
          $("tokenWait").textContent = (opened ? text.waitingToken + " " : text.openTokenPage + " ") + openUrl;
          const deadline = Date.now() + 300000;
          while (Date.now() < deadline && request === tokenPoll) {
            await delay(2000);
            if (request !== tokenPoll) return;
            const poll = await fetch(API_ORIGIN + "/api/dbx/token-grant/poll", {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({ pollSecret }),
            });
            let body = {};
            try { body = await poll.json(); } catch { body = {}; }
            if (poll.status === 429) throw new Error(text.rate);
            if (body.status === "ready" && typeof body.token === "string" && body.token) {
              $("token").value = body.token;
              await persist();
              tokenFetchState = "filled";
              $("tokenWait").hidden = true;
              showError("");
              return;
            }
            if (body.status === "expired") break;
          }
          if (request === tokenPoll) {
            tokenFetchState = "idle";
            showError(text.tokenTimeout);
          }
        } catch (error) {
          if (request !== tokenPoll) return;
          tokenFetchState = "idle";
          const message = error instanceof TypeError ? text.cors : (error && error.message) || text.tokenFailed;
          showError(message);
        } finally {
          if (request === tokenPoll) setFetchButton();
        }
      }

      $("create").addEventListener("click", () => publish("create"));
      $("update").addEventListener("click", () => publish("update"));
      $("loadMore").addEventListener("click", loadMore);
      $("useGrid").addEventListener("click", () => { pinned = null; render(); });
      $("copy").addEventListener("click", copyLink);
      $("includeSql").addEventListener("change", () => { persist().catch(() => {}); });
      $("token").addEventListener("change", () => { persist().catch(() => {}); });
      $("fetchToken").addEventListener("click", () => { fetchTokenFromAccount().catch(() => {}); });
      $("template").addEventListener("change", () => { fillThemeSelect(); persist().catch(() => {}); });
      $("theme").addEventListener("change", () => { persist().catch(() => {}); });
      $("toggleTables").addEventListener("click", toggleTableSelection);
      $("tableFilter").addEventListener("input", () => renderTablePicker());
      $("form").addEventListener("submit", (event) => event.preventDefault());

      applyLocale("zh-CN");
      render();

      const host = window.dbxPlugin;
      if (!host || !host.ready) {
        showError(text.outside);
      } else {
        host.ready.then(async (context) => {
          applyLocale(host.locale);
          if (host.capabilities && host.capabilities.storage && host.storage) {
            try { settings = normalizeSettings(await host.storage.get(STORAGE_KEY)); } catch { settings = emptySettings(); }
          }
          $("token").value = settings.apiToken;
          $("includeSql").checked = settings.includeSql;
          $("template").value = settings.templateId || "plain";
          fillThemeSelect();
          if (settings.themeClass && !$("themeField").hidden) $("theme").value = settings.themeClass;
          applyHostContext(context || host.context || {});
          if (typeof host.onContext === "function") {
            host.onContext((next) => {
              applyHostContext(next, { keepTitle: Boolean(pinned) });
            });
          }
        }).catch((error) => {
          showError((error && error.message) || String(error));
        });
        window.addEventListener("dbx-plugin-env", (event) => {
          applyLocale(event.detail && event.detail.locale);
          render();
        });
      }
    </script>
  </body>
</html>
