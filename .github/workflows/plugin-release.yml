name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    # plugin-sdk-v1 is the template ref, but that tag does not exist.
    # plugin-cli-v0.1.9 is the released tag that contains this reusable workflow.
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.9
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: "0.1.9"
      build-matrix: '{"include":[{"runner":"ubuntu-24.04","target":"universal"}]}'
